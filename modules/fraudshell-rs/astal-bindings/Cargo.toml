[package]
name = "astal-bindings"
version = "0.1.0"
edition = "2024"
description = "Unified Rust bindings for libastal"
authors = ["FaceFTW"]
license = "MIT"

[dependencies]
# Core GTK dependencies
gtk4 = "0.10.3"
gtk4-sys = "0.10.3"
gdk4 = "0.10.3"
gdk4-sys = "0.10.3"
glib = "0.21.5"
glib-sys = "0.21.5"
gio = "0.21.5"
gio-sys = "0.21.5"
gobject-sys = "0.21.5"

# For native FFI (generated code references)
libc = "0.2"

# Feature-gated dependencies
nm-rs = { version = "0.1.3", optional = true }
nm-rs-sys = { version = "0.1.1", optional = true }
json-glib = { version = "0.1.0", optional = true }
json-glib-sys = { version = "0.1.0", optional = true }

[features]
default = ["core"]

# Core astal4 - always included
core = []

# Optional library modules
battery = []
apps = []
auth = []
bluetooth = []
cava = []
greet = []
hyprland = []
io = []
mpris = []
network = ["nm-rs", "nm-rs-sys"]
notifd = []
niri = []
powerprofiles = []
river = []
tray = []
wireplumber = []

# Convenience feature sets
all = [
    "core", "battery", "apps", "auth", "bluetooth", "cava", 
    "greet", "hyprland", "io", "mpris", "network", "notifd", 
    "niri", "powerprofiles", "river", "tray", "wireplumber"
]

desktop = ["core", "battery", "network", "mpris", "notifd", "tray"]
hyprland-full = ["core", "hyprland", "io", "network"]