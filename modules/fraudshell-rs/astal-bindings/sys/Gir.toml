# Gir.toml - master config to generate *sys* (low-level) bindings for all Astal libraries
# Run from repo root (where ./girs and ./gtk-girs exist).
# Generated output will go into sys/src/<module> (one namespace per Astal sublibrary).
#
# This file intentionally marks common external GI namespaces as `manual` so that
# gir does NOT try to generate GLib/Gio/Gtk/Gdk types into astal-sys.
# The high-level `astal` crate should depend on the standard Rust crates
# (glib, gio, gtk4, gdk4, json-glib, etc.) and reference those types.
#
# If your gir binary doesn't recognise "work_mode = 'sys'", switch to "normal"
# — but the intent here is to produce raw, low-level/ffi-like bindings.

[options]
library="Astal"
version="4.0"
# Where GIR files / gir-files are located. Adjust if different.
girs_directories = ["../girs"]
# Default work mode for generation. 'sys' here communicates intent to produce
# low-level bindings; if your gir installation expects 'normal', change it.
work_mode = "sys"
# Do not attempt to produce docgen for the high-level API in the sys crate
use_gi_docgen = false
# Avoid adding high-level safety asserts in sys bindings (they'll be in high-level crate)
generate_safety_asserts = false
# Generate builder helpers isn't needed for raw sys, but safe to set false
generate_builder = false
# Trust introspection return value nullability where available
trust_return_value_nullability = true

###############################################################################
# Core Astal (Astal 4)
###############################################################################
[[library]]
name = "astal-core"
library = "Astal"
version = "4.0"
min_cfg_version = "4.0"
gir_file = "girs/Astal-4.0.gir"
target_path = "sys/src/core"        # generated into astal-sys/src/core
work_mode = "sys"

# Treat Gtk/Gdk/Gio/GLib objects that belong to external crates as manual:
# - High-level wrappers will reuse the gtk/gio/glib crates from crates.io.
manual = [
  "Gtk.Widget",
  "Gtk.Window",
  "Gtk.Application",
  "Gtk.Box",
  "Gtk.Scale",
  "Gtk.Range",
  "Gdk.Monitor",
  "Gio.Application",
  "Gio.SocketConnection",
  "GObject.InitiallyUnowned",
  "GLib.Error",
  "GLib.ObjectPath",
  # AstalIO.Application is in astal-io; ensure astal-io library is generated as separate module below.
  "AstalIO.Application",
]

# Optionally restrict which symbols are generated (leave empty to generate everything
# under Astal.*). Listing here keeps control if you want to limit to common/core types.
generate = [
  "Astal.WindowAnchor",
  "Astal.Exclusivity",
  "Astal.Layer",
  "Astal.Keymode",
  "Astal.Bin",
  "Astal.Box",
  "Astal.Slider",
  "Astal.Window",
  "Astal.Application",
]

# Generate all Astal.* objects by pattern too (redundant if generate lists everything)
[[library.object]]
name = "Astal.*"
status = "generate"

###############################################################################
# Astal IO
###############################################################################
[[library]]
name = "astal-io"
library = "Astal"
version = "4.0"
gir_file = "girs/AstalIO-0.1.gir"
target_path = "sys/src/io"
work_mode = "sys"

manual = [
  "Gio.Application",
  "GLib.Error",
  "GLib.Variant",
  "GObject.Object",
]

[[library.object]]
name = "AstalIO.*"
status = "generate"

###############################################################################
# Astal Battery / Power (example)
###############################################################################
[[library]]
name = "astal-battery"
library = "Astal"
version = "4.0"
gir_file = "girs/AstalBattery-0.1.gir"
target_path = "sys/src/battery"
work_mode = "sys"

manual = [
  "GLib.Error",
  "GLib.ObjectPath",
  # Delegate UPower types if provided by system (or mark them if needed)
  "UPower.Device",
]

generate = [
  "AstalBattery.State",
  "AstalBattery.Technology",
  "AstalBattery.WarningLevel",
  "AstalBattery.BatteryLevel",
  "AstalBattery.Type",
  "AstalBattery.Device",
  "AstalBattery.UPower",
]

[[library.object]]
name = "AstalBattery.*"
status = "generate"

