# Main astal core library
[[library]]
name = "astal-core"
version = "4.0"
gir_file = "girs/Astal-4.0.gir"
target_path = "src/core"
library = "Astal"
external_libraries = [
    "Gtk.Widget",
    "Gtk.Window",
    "Gtk.Application",
    "Gio.Application",
    "AstalIO",
]
generate = [
    "Astal.WindowAnchor",
    "Astal.Exclusivity",
    "Astal.Layer",
    "Astal.Keymode",
    "Astal.Bin",
    "Astal.Box",
    "Astal.Slider",
    "Astal.Window",
    "Astal.Application",
]

[[library]]
name = "astal-battery"
version = "0.1"
gir_file = "girs/AstalBattery-0.1.gir"
target_path = "src/battery"
library = "AstalBattery"
generate = [
    "AstalBattery.State",
    "AstalBattery.Technology",
    "AstalBattery.WarningLevel",
    "AstalBattery.BatteryLevel",
    "AstalBattery.Type",
    "AstalBattery.Device",
    "AstalBattery.UPower",
]

