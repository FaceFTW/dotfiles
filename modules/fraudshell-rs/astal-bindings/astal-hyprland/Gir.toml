[options]
girs_directories = ["../../gtk-girs", "../../girs"]
library = "AstalHyprland"
version = "0.1"
min_cfg_version = "0.1"
target_path = "."
work_mode = "normal"
use_gi_docgen = true
generate_safety_asserts = true
deprecate_by_min_version = true
single_version_file = true
generate_builder = true
trust_return_value_nullability = true

generate = [
    "AstalHyprland.Fullscreen",
    "AstalHyprland.Client",
    "AstalHyprland.Workspace",
    "AstalHyprland.Monitor",
    "AstalHyprland.Hyprland",
    "AstalHyprland.Bind",
    "AstalHyprland.Position",
    "AstalHyprland.MonitorTransform",
]

manual = ["Gio.AsyncReadyCallback", "Gio.AsyncResult", "GLib.Error"]

[[object]]
name = "AstalHyprland.*"
status = "generate"
